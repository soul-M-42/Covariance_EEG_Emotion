
defaults:
  - _self_
  - data@data_0: SEED
  - data@data_1: SEEDIV
  - data@data_2: SEEDVII
  - data@data_3: DEAP
  - data@data_4: None
  - data@data_val: SEEDVII

log:
  run_name: 'BALANCED_S1S4S7D_CDA=0'
  mlp_cp_dir: 'mlp_cp'

data_cfg_list:

train:
  parallel: True
  seed: 19260832
  n_fold: 1
  n_pairs: 1024
  n_gpu_use: 3
  iftest: False
  lr: 5e-4
  wd: 0.0001
  loss_temp: 0.07
  max_epochs: 20
  min_epochs: 1
  num_workers: 127
  save_interval: 5
  loss:
    clisa_loss: True
    temp: 0.07
    CDA_loss: True
    CDA_factor: 2e-2
    to_riem: False

val:
  n_fold: '1->3'
  extractor:
    use_pretrain: True
    ckpt_epoch: 20
    reverse: False
    normTrain: False
    batch_size: 64
    fea_mode: 'me'
    rn_decay: 0.990
    LDS: True
  mlp:
    seed: 19260817
    lr: 0.0005  #0.0005
    wd: 0.0022   #0.001-0.005
    hidden_dim: 128
    out_dim: ${data_val.n_class}
    batch_size: 256
    max_epochs: 8
    min_epochs: 2
    num_workers: ${train.num_workers}
  
model:
  encoder: 'MLLA'
  cnn:
    n_timeFilters: 16
    timeFilterLen: 30
    n_msFilters: 4
    msFilter_timeLen: 3
    n_channs: 64
    dilation_array: [1,3,6,12]
    seg_att: 15
    avgPoolLen: 15
    timeSmootherLen: 3
    multiFact: 1
    stratified: ['initial', 'middle1', 'middle2']
    activ: 'softmax'
    temp: 1.0
    saveFea: False
    has_att: True
    extract_mode: '${val.extractor.fea_mode}'
    global_att: False
  TST_single:
    n_heads: 1
    patch_len: 32
    patch_stride: 4
    n_channs: 1
    cnn:
      n_timeFilters: 16
      timeFilterLen: 30
      n_msFilters: 4
      msFilter_timeLen: 3
      n_channs: 64
      dilation_array: [1,3,6,12]
      seg_att: 15
      avgPoolLen: 15
      timeSmootherLen: 3
      multiFact: 1
      stratified: ['initial', 'middle1', 'middle2']
      activ: 'softmax'
      temp: 1.0
      saveFea: False
      has_att: True
      extract_mode: '${val.extractor.fea_mode}'
      global_att: False
  MLLA:
    patch_size: 32
    patch_stride: 4
    hidden_dim: 128
    out_dim: 32
    depth: 2
    n_heads: 8
    uni_channels: [
        "FP1", "FP2", "FZ", "F3", "F4", "F7", "F8", "FC1", "FC2", "FC5", "FC6", "CZ",
        "C3", "C4", "T7", "T8", "CP1", "CP2", "CP5", "CP6", "PZ", "P3", "P4", "P7",
        "P8", "PO3", "PO4", "OZ", "O1", "O2"
    ]
    cnn:
      n_timeFilters: 32
      timeFilterLen: 30
      n_msFilters: 4
      msFilter_timeLen: 3
      n_channs: 64
      dilation_array: [1,3,6,12]
      seg_att: 15
      avgPoolLen: 15
      timeSmootherLen: 3
      multiFact: 1
      stratified: ['initial', 'middle1', 'middle2']
      activ: 'softmax'
      temp: 1.0
      saveFea: False
      has_att: True
      extract_mode: '${val.extractor.fea_mode}'
      global_att: False
